<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medix</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="app-bar">
      <div class="brand">
        <span class="logo">M E D I X</span>
        <span class="tagline">local converter</span>
      </div>
      <div class="app-bar-actions">
        <span id="version" class="version"></span>
        <button id="theme-toggle" class="icon-btn" title="Toggle theme">◐</button>
      </div>
    </header>

    <div id="prereq" class="banner banner-error" hidden>
      <strong id="prereq-title">FFmpeg problem.</strong>
      <span id="prereq-hint"></span>
    </div>

    <nav class="tabs">
      <button class="tab active" data-tab="convert">Convert</button>
      <button class="tab" data-tab="history">History</button>
    </nav>

    <main>
      <!-- ───────────────── Convert ───────────────── -->
      <section id="tab-convert" class="tab-panel active">
        <div class="card">
          <h2>Source</h2>
          <div class="path-row">
            <input
              id="path-input"
              type="text"
              class="text-field"
              placeholder="Point to a file or folder…"
              autocomplete="off"
            />
            <button id="pick-file" class="btn-tonal">File</button>
            <button id="pick-dir" class="btn-tonal">Folder</button>
          </div>
          <div class="row-between">
            <label class="switch">
              <input id="recursive" type="checkbox" />
              <span class="slider"></span>
              <span class="switch-label">Recurse into subfolders</span>
            </label>
            <button id="scan-btn" class="btn-filled">Scan</button>
          </div>
          <p id="scan-status" class="status-text"></p>
        </div>

        <div id="files-card" class="card" hidden>
          <div class="row-between">
            <h2>Discovered files</h2>
            <label class="checkbox">
              <input id="select-all" type="checkbox" checked />
              <span>Select all</span>
            </label>
          </div>
          <div class="table-wrap">
            <table id="files-table">
              <thead>
                <tr>
                  <th></th>
                  <th>File</th>
                  <th>Type</th>
                  <th>Resolution</th>
                  <th>Duration</th>
                  <th>Size</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div id="settings-card" class="card" hidden>
          <h2>Output settings</h2>
          <div class="grid">
            <label class="field">
              <span>Output format</span>
              <select id="output-format" class="select"></select>
            </label>
            <label class="field">
              <span>Output folder</span>
              <div class="path-row inline">
                <input id="output-dir" type="text" class="text-field" />
                <button id="pick-output" class="btn-tonal" type="button">Browse</button>
              </div>
            </label>
          </div>

          <label class="switch standalone">
            <input id="advanced-toggle" type="checkbox" />
            <span class="slider"></span>
            <span class="switch-label">Advanced encoding</span>
          </label>

          <div id="advanced" class="grid" hidden>
            <label class="field">
              <span>Video codec</span>
              <select id="video-codec" class="select"></select>
            </label>
            <label class="field">
              <span>Audio codec</span>
              <select id="audio-codec" class="select"></select>
            </label>
            <label class="field">
              <span>Resolution</span>
              <select id="resolution" class="select"></select>
            </label>
            <label class="field">
              <span>Frame rate</span>
              <select id="frame-rate" class="select"></select>
            </label>
            <label class="field">
              <span>Preset</span>
              <select id="preset" class="select"></select>
            </label>
            <label class="field">
              <span>Audio bitrate</span>
              <select id="audio-bitrate" class="select"></select>
            </label>
            <label class="field span-2">
              <span>CRF quality <em id="crf-value">23</em> <small>(lower = better)</small></span>
              <input id="crf" type="range" min="0" max="51" value="23" class="range" />
            </label>
          </div>

          <div class="row-end">
            <button id="convert-btn" class="btn-filled large">Convert</button>
          </div>
        </div>

        <div id="progress-card" class="card" hidden>
          <h2>Progress</h2>
          <div class="overall">
            <div class="row-between">
              <span>Overall</span>
              <span id="overall-pct">0%</span>
            </div>
            <div class="progress-track"><div id="overall-bar" class="progress-fill"></div></div>
          </div>
          <div id="progress-list"></div>
        </div>

        <div id="result-card" class="card" hidden>
          <h2 id="result-title">Complete</h2>
          <p id="result-summary"></p>
          <button id="open-output" class="btn-tonal">Open output folder</button>
        </div>
      </section>

      <!-- ───────────────── History ───────────────── -->
      <section id="tab-history" class="tab-panel">
        <div class="card">
          <div class="row-between">
            <h2>Conversion history</h2>
            <div class="chips" id="window-chips">
              <button class="chip" data-window="24h">24h</button>
              <button class="chip active" data-window="7d">7 days</button>
              <button class="chip" data-window="30d">30 days</button>
              <button class="chip" data-window="all">All</button>
            </div>
          </div>
          <div id="history-list" class="history-list"></div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
